<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Control de gastos personal con presupuestos y analiticas.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Control">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F0F2F8">

  <base href="$FLUTTER_BASE_HREF">
  <title>Control</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">

  <script>
    (function () {
      var VERSION = '__APP_VERSION__';
      var KEY = 'control_shell_version';

      function clearLegacyCaches() {
        var tasks = [];
        if ('serviceWorker' in navigator) {
          tasks.push(
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            })
          );
        }
        if ('caches' in window) {
          tasks.push(
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) { return caches.delete(key); }));
            })
          );
        }
        return Promise.all(tasks);
      }

      function loadFlutter() {
        var script = document.createElement('script');
        script.src = 'flutter_bootstrap.js?v=' + encodeURIComponent(VERSION);
        script.async = true;
        document.body.appendChild(script);
      }

      window.addEventListener('flutter-first-frame', function () {
        var el = document.getElementById('loading');
        if (!el) return;
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 500);
      });

      clearLegacyCaches().then(function () {
        var previous = localStorage.getItem(KEY);
        if (previous && previous !== VERSION) {
          localStorage.setItem(KEY, VERSION);
          var url = new URL(window.location.href);
          url.searchParams.set('v', VERSION);
          window.location.replace(url.toString());
          return;
        }
        localStorage.setItem(KEY, VERSION);
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', loadFlutter);
        } else {
          loadFlutter();
        }
      });
    })();
  </script>

  <style>
    html, body { margin:0; padding:0; height:100%; overflow:hidden;
      background:#F0F2F8; -webkit-tap-highlight-color:transparent; }
    #loading {
      position:fixed; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
      background:#F0F2F8; transition:opacity .45s ease; z-index:10;
    }
    #loading::before, #loading::after {
      content:''; position:absolute; border-radius:50%; filter:blur(80px);
    }
    #loading::before { width:420px; height:420px; top:-120px; left:-110px;
      background:rgba(59,91,219,.22); }
    #loading::after { width:460px; height:460px; bottom:-180px; right:-130px;
      background:rgba(108,92,224,.20); }
    #loading img { width:84px; height:84px; border-radius:22px; position:relative;
      box-shadow:0 18px 40px -14px rgba(14,42,78,.5); }
    #loading .name { position:relative; font-size:22px; font-weight:800;
      letter-spacing:-.04em; color:#0C1B2E; }
    #loading .bar { position:relative; width:112px; height:3px; border-radius:9px;
      background:rgba(12,27,46,.12); overflow:hidden; }
    #loading .bar i { position:absolute; inset:0; width:40%; border-radius:9px;
      background:linear-gradient(90deg,#3B5BDB,#6C5CE0); animation:slide 1.15s ease-in-out infinite; }
    @keyframes slide { 0%{left:-40%} 100%{left:100%} }
    .hidden { opacity:0; pointer-events:none; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Control</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
